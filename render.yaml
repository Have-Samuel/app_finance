services:
  - type: web
    name: app-finance
    runtime: docker
    envVars:
      - key: RAILS_MASTER_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: app-finance-db
          property: connectionString
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
    healthCheckPath: /up
    plan: free

databases:
  - name: app-finance-db
    plan: free
